{% extends "base.html" %}

{% block title %}log in{% endblock %}
{% block heading %}log in{% endblock %}
{% block tagline %}{% endblock %}

{% block content %}
<section>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="field">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="pseudonym">commons name or email address</label>
    <input type="text" id="pseudonym" name="pseudonym" autocomplete="username"
           autocapitalize="none" spellcheck="false" required>
    <label for="password">password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">Forgotten your password? <a href="{{ url_for('forgot') }}">We can email you a link.</a></p>
</section>
{% endblock %}
